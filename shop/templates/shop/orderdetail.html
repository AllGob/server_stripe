<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order #{{ order.id }}</title>
</head>
<body>
<h1>Order #{{ order.id }}</h1>
<ul>
{% for item in order.items.all %}
    <li>Items: {{ item.name }} Price: ${{ item.price }}</li>
{% endfor %}
</ul>
<p>Total: ${{ total_price }}</p>
<div id="error-message" style="color: rgb(60, 217, 178);"></div>
<button id="buy-button" data-buy-url="{% url 'buy-order' order.id %}">Buy</button>
<script>
    window.STRIPE_PUBLISHABLE_KEY = "{{ stripe_publishable_key }}";
</script>
<script src="https://js.stripe.com/v3/"></script>
<script src="{% static 'shop/js/checkout.js' %}"></script>
</body>
</html>
